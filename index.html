<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ĐỌC TRUYỆN CỔ THIẾU NHI</title>
    <meta name="description" content="Ứng dụng đọc truyện cổ tích thiếu nhi hoàn toàn offline không cần API, giao diện khung văn bản nền giấy ấm áp bảo vệ mắt cùng giọng đọc truyền cảm." />
    <meta name="theme-color" content="#6d4323" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Non-blocking font load with instant system fallback for 100% offline support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Quicksand:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Quicksand:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body class="bg-[#f5efe6] text-slate-800 antialiased selection:bg-amber-200 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Register offline service worker if available
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
